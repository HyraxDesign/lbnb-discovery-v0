name: Recover verified Drive listing photos

on:
  push:
    branches: [development/nava-v1.6-operational]
    paths:
      - scripts/drive-media-manifest.json
      - scripts/recover-drive-media.py
      - .github/workflows/recover-media.yml

permissions:
  contents: write

concurrency:
  group: recover-drive-media
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/nava-v1.6-operational
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0
      - name: Download and verify original photos
        run: python scripts/recover-drive-media.py
      - name: Include the latest development fixes before validation
        run: |
          git fetch origin development/nava-v1.6-operational
          git rebase origin/development/nava-v1.6-operational
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify card actions, photos and multi-day itinerary
        run: |
          npm test
          python -m http.server 8765 --directory lbnb-v0-live-07/site > /tmp/nava-server.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nava-v161-browser-proof-${{ github.run_attempt }}
          path: /tmp/nava-*.png
      - name: Commit recovered images to the development branch
        run: |
          git config user.name 'NAVA media recovery'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lbnb-v0-live-07/site/media/listings
          if ! git diff --cached --quiet; then
            git commit -m 'Recover 480 verified original Drive listing photos'
            git push origin HEAD:development/nava-v1.6-operational
          fi
