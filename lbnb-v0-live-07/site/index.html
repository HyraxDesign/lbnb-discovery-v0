.journeySubTabs{display:flex;gap:6px;margin:-6px 0 16px}.journeySubTabs button{border:1px solid #d8d2c8;background:#fff;border-radius:999px;padding:8px 12px;font-size:9px;font-weight:700}.journeySubTabs button.active{background:#111;color:#fff;border-color:#111}
.calendarCard{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.05)}.calendarHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendarHead strong{font-size:14px}.calendarGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calDow{text-align:center;color:#99938a;font-size:7px;text-transform:uppercase;padding:3px}.calDay{min-height:49px;border:1px solid #eee9e0;border-radius:9px;padding:5px;font-size:8px;color:#77736c;background:#faf9f6}.calDay.empty{border-color:transparent;background:transparent}.calDay.journeyDay{border-color:#111;background:#f0ede6;color:#111}.calDay.bookingDay{box-shadow:inset 0 -3px 0 #111}.calEvent{display:block;margin-top:4px;background:#111;color:#fff;border-radius:5px;padding:3px;font-size:6.5px;line-height:1.1;overflow:hidden}.bookingList{display:grid;gap:9px}.bookingCard{display:flex;gap:11px;align-items:center;background:#fff;border-radius:16px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.05)}.bookingCard .icon{width:42px;height:42px;border-radius:13px;background:#111;color:#fff;display:grid;place-items:center;font-size:17px}.bookingCard .info{flex:1}.bookingCard small{display:block;color:#817b72;font-size:7px;letter-spacing:.08em;text-transform:uppercase}.bookingCard strong{display:block;font-size:12px;margin-top:3px}.bookingCard span{display:block;color:#77736c;font-size:9px;margin-top:3px}.bookingCard button{border:0;background:#ece7de;border-radius:999px;padding:8px 10px;font-size:8px}.bookingPanel{margin-top:17px;padding:14px;border-radius:16px;background:#ebe6dd}.bookingPanel small{display:block;color:#817b72;font-size:7px;letter-spacing:.09em;text-transform:uppercase}.bookingPanel strong{display:block;font-size:12px;margin-top:4px}.bookingPanel p{font-size:10px!important;margin-top:5px!important}.bookingPanel button{margin-top:10px;border:0;border-radius:999px;background:#111;color:#fff;padding:9px 11px;font-size:9px;font-weight:700}.bookingPanel button.secondary{background:#fff;color:#111;border:1px solid #d8d2c8}.bookingPanel button[disabled]{opacity:.45}
.actionSheet input{width:100%;border:1px solid #d8d2c8;border-radius:12px;padding:11px 12px;margin:5px 0 8px;background:#fff;color:#111}.actionSheet .formRow{padding:4px 12px 10px}.actionSheet .formRow label{display:block;color:#77736c;font-size:8px;text-transform:uppercase;letter-spacing:.08em;margin:7px 0 3px}.actionSheet .primarySheet{background:#111!important;color:#fff!important;text-align:center!important}.actionSheet .dangerSheet{color:#a33!important;text-align:center!important}


/* V1.3 — interaction correction pass */
.railTransition{align-items:flex-start;justify-content:flex-end;text-align:left;padding:0 4px 13px 24px}
.railTransition span,.railTransition b{width:100%;text-align:left}
.reel{cursor:zoom-in}.railShell,.topbar{cursor:default}.sheetHero.mediaTap{cursor:zoom-in}
.planDateButton{border:0;cursor:pointer}.planDateButton:active{transform:translateY(1px)}
.itineraryDateButton{border:0;background:transparent;color:#111;padding:0;text-align:left;font-size:14px;font-weight:750;cursor:pointer}
.itineraryDateButton span{display:block;color:#77736c;font-size:9px;font-weight:500;margin-top:3px}
.actionSheet .sheetHelp{padding:0 12px 9px;color:#77736c;font-size:9px;line-height:1.45}
.mediaViewer{position:absolute;inset:0;z-index:120;background:#0b0b0b;color:#fff;display:flex;flex-direction:column;overflow:hidden}
.mediaViewer[hidden]{display:none!important}.mediaViewerMedia{position:absolute;inset:0;display:grid;place-items:center;background:#111}.mediaViewerMedia img{width:100%;height:100%;object-fit:contain;display:block}.mediaViewer.cover .mediaViewerMedia img{object-fit:cover}.mediaViewerShade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.34),transparent 24%,transparent 67%,rgba(0,0,0,.72));pointer-events:none}
.mediaViewerTop{position:absolute;z-index:3;left:14px;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}.mediaViewerTop button{width:42px;height:42px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:24px;backdrop-filter:blur(8px)}.mediaViewerCount{font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.38);padding:8px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.mediaViewerBottom{position:absolute;z-index:3;left:18px;right:18px;bottom:max(24px,env(safe-area-inset-bottom));text-shadow:0 1px 14px rgba(0,0,0,.5)}.mediaViewerBottom small{display:block;font-size:8px;letter-spacing:.1em;text-transform:uppercase;opacity:.72}.mediaViewerBottom strong{display:block;font-size:22px;line-height:1.08;margin-top:6px}.mediaViewerBottom p{font-size:11px;line-height:1.4;opacity:.84;margin:7px 0 0;max-width:90%}.mediaViewerNav{position:absolute;z-index:4;top:50%;transform:translateY(-50%);width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font-size:22px}.mediaViewerNav.prev{left:10px}.mediaViewerNav.next{right:10px}
.reelBg img{object-fit:cover;object-position:center center;min-width:100%;min-height:100%}
.bookingPanel .secondary{margin-left:6px}

<body>
<div id="app">
  <div class="loader" id="loader"><div><b style="letter-spacing:.12em">NAVA</b><small>V1 PROTOTYPE · LOADING</small></div></div>
  <div class="topbar">
    <button class="brand" id="brandBtn">NAVA <small>PILOT</small></button>
    <div class="topActions"><button id="exploreBtn">Explore</button><button id="myBtn">My <span class="count" id="savedCount">0</span></button></div>
  </div>
  <main id="feed"></main>
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden><div class="sheetScroller" id="sheetScroller"></div></section>
  <section class="view" id="exploreView" hidden>
    <header class="viewHeader"><button class="back" id="exploreBack">←</button><div><small>Lebanon pilot</small><h1>Explore</h1></div></header>
    <div class="exploreIntro"><strong>Places to stay, connected to the places around them.</strong><span>The original LBNB Lebanon collection, rewritten for the new place graph. Current host details are being reconfirmed.</span></div>
    <input class="exploreSearch" id="exploreSearch" type="search" placeholder="Search a place or area…" autocomplete="off">
    <div class="filterChips" id="filterChips"></div>
    <div class="exploreMeta" id="exploreMeta"></div>
    <div class="exploreGrid" id="exploreGrid"></div>
  </section>
  <section class="view" id="myView" hidden>
    <header class="viewHeader"><button class="back" id="myBack">←</button><div><small>Your continuum</small><h1>My</h1></div></header>
    <div class="tabs"><button class="active" data-my-tab="saved">Saved</button><button data-my-tab="journeys">Journeys</button><button data-my-tab="bookings">Bookings</button></div>
    <div id="myContent"></div>
  </section>
  <section class="view" id="journeyView" hidden>
    <header class="viewHeader"><button class="back" id="journeyBack">←</button><div><small>Journey</small><h1>Lisbon</h1></div></header>
    <div id="journeyContent"></div>
  </section>
  <div class="actionSheet" id="actionSheet" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const CONTENT_KEY='nava_v1_content';
const SAVED_KEY='nava_v1_saved';
const PLANNED_KEY='nava_v1_planned';
let data=null, objects={}, objectStack=[], journeyMode='normal', journeyVariant='default', currentMyTab='saved';
const $=id=>document.getElementById(id);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const valid=d=>d&&Array.isArray(d.objects)&&Array.isArray(d.reels);
const destination=o=>o?.destination||o?.area||'Saved';
const displayType=o=>o?.subtype==='stay'?'STAY':String(o?.type||'place').toUpperCase();
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),1350)}
function readSaved(){try{return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]')}catch(e){return[]}}
function writeSaved(v){localStorage.setItem(SAVED_KEY,JSON.stringify(v));$('savedCount').textContent=v.length;updateSavedCardStates()}
function isSaved(id){return readSaved().includes(id)}
function toggleSaved(id){let s=readSaved(), on=s.includes(id);s=on?s.filter(x=>x!==id):[...s,id];writeSaved(s);return !on}
function updateSavedCardStates(){document.querySelectorAll('[data-object]').forEach(el=>el.classList.toggle('saved',isSaved(el.dataset.object)))}
function obj(id){return objects[id]}

async function loadContent(){let loaded=null;try{const r=await fetch('./lbnb-content-v0.json?v=130',{cache:'reload'});if(r.ok)loaded=await r.json()}catch(e){}if(!valid(loaded)){try{loaded=JSON.parse(localStorage.getItem(CONTENT_KEY)||'null')}catch(e){}}if(!valid(loaded)){document.querySelector('#loader div').innerHTML='<b>Could not load content.</b><small>Open the hosted build or check the JSON file.</small>';return}data=loaded;objects=Object.fromEntries(data.objects.map(o=>[o.id,o]));localStorage.setItem(CONTENT_KEY,JSON.stringify(data));writeSaved(readSaved());renderFeed();$('loader').hidden=true;openDeepLink()}

function reelItems(r){return (r.objects||[]).map(x=>({...x,o:obj(x.object_id)})).filter(x=>x.o)}
function cardHTML(o,role='related'){return `<button class="card ${isSaved(o.id)?'saved':''}" data-object="${esc(o.id)}"><div class="cardVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="cardCopy"><small>${esc(displayType(o))}${role==='direct'?' · in reel':''}</small><strong>${esc(o.title)}</strong><span>${esc(o.area||o.destination||'')}</span></div></button>`}
function orderedReels(){const requested=new URLSearchParams(location.search).get('r');let list=[...data.reels];if(requested){const i=list.findIndex(r=>r.id===requested);if(i>0)list.unshift(list.splice(i,1)[0]);return list}const s=readSaved().map(obj).filter(Boolean);const counts={};s.forEach(o=>counts[destination(o)]=(counts[destination(o)]||0)+1);const pref=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];if(pref&&Math.random()<.68)list=[...list.filter(r=>r.destination===pref),...list.filter(r=>r.destination!==pref)];else list=list.sort(()=>Math.random()-.5);return list}
function renderFeed(){const reels=orderedReels();$('feed').innerHTML=reels.map((r,i)=>{const items=reelItems(r),first=items[0]?.o,direct=items.filter(x=>x.role==='direct'),related=items.filter(x=>x.role!=='direct');return `<section class="reel" data-reel="${esc(r.id)}"><div class="reelBg">${(r.media||first?.image)?`<img src="${esc(r.media||first.image)}" alt="" loading="${i===0?'eager':'lazy'}" referrerpolicy="no-referrer">`:''}</div><div class="reelFallback">${esc((r.destination||'DISCOVER').toUpperCase())}</div><div class="reelCopy"><div class="reelMeta">${esc(r.destination||'DISCOVER')} · discovery</div><p class="caption">${esc(r.caption||'')}</p></div><div class="railShell"><button class="railArrow left" aria-label="scroll left">‹</button><div class="rail"><div class="railHint">IN THIS<b>REEL</b></div>${direct.map(x=>cardHTML(x.o,'direct')).join('')}${related.length?`<div class="railTransition">EXPLORE<b>FROM HERE</b></div>`:''}${related.map(x=>cardHTML(x.o,'related')).join('')}</div><button class="railArrow right" aria-label="scroll right">›</button></div></section>`}).join('');bindCards(document);bindRails();updateSavedCardStates()}
function bindCards(root){root.querySelectorAll('[data-object]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-remove]'))return;openObject(obj(el.dataset.object),true)}})}
function bindRails(){document.querySelectorAll('.reel').forEach(reel=>{const rail=reel.querySelector('.rail'),left=reel.querySelector('.railArrow.left'),right=reel.querySelector('.railArrow.right');left.onclick=()=>rail.scrollBy({left:-230,behavior:'smooth'});right.onclick=()=>rail.scrollBy({left:230,behavior:'smooth'});let down=false,startX=0,startScroll=0,moved=false;rail.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){down=true;moved=false;startX=e.clientX;startScroll=rail.scrollLeft;rail.setPointerCapture(e.pointerId);rail.classList.add('dragging')}});rail.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)moved=true;rail.scrollLeft=startScroll-dx});rail.addEventListener('pointerup',e=>{down=false;rail.classList.remove('dragging');if(moved){const blocker=ev=>{ev.preventDefault();ev.stopPropagation();rail.removeEventListener('click',blocker,true)};rail.addEventListener('click',blocker,true)}});rail.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&rail.scrollWidth>rail.clientWidth){e.preventDefault();rail.scrollLeft+=e.deltaY}},{passive:false})})}

function primaryHeading(o){if(o.type==='experience')return'The experience';if(o.type==='story')return'The story';return'Why it matters'}
function relationLabel(r){return ({inside:'inside',contains:'contains',near:'near',context:'context',thematic:'related idea',cultural:'cultural link',historical:'historical link',experience:'experience',journey:'continue the journey',contrast:'see the contrast'})[r]||r||'connected'}
function connected(o){return (o.connections||[]).map(c=>({c,o:obj(c.object_id)})).filter(x=>x.o).slice(0,7)}
function connectionHTML(x){const o=x.o;return `<button class="connection" data-connect="${esc(o.id)}">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}<div><small>${esc(displayType(o))}</small><strong>${esc(o.title)}</strong><span class="relationship">${esc(relationLabel(x.c.relationship))}</span></div></button>`}
function practicalHTML(o){const p=o.practical||{},facts=Object.entries(p).filter(([k])=>k!=='map_query');return `${facts.length?`<div class="practicalGrid">${facts.map(([k,v])=>`<div class="fact"><small>${esc(k.replaceAll('_',' '))}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}${p.map_query?`<a class="linkBtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.map_query)}">View on map</a>`:''}`}
function renderSheet(o){const rel=connected(o), saved=isSaved(o.id);$('sheetScroller').innerHTML=`<div class="grabZone" id="grabZone"><div class="grab"></div></div><div class="sheetHero">${o.image?`<img src="${esc(o.image)}" alt="" referrerpolicy="no-referrer">`:''}<div class="sheetTop"><button class="circle" id="sheetBack" ${objectStack.length<2?'hidden':''}>←</button><button class="circle" id="closeSheet">×</button></div></div><div class="sheetBody"><p class="eyebrow">${esc(displayType(o))} · ${esc(o.area||o.destination||'')}</p><h2>${esc(o.title)}</h2><p class="summary">${esc(o.summary||'')}</p><div class="actions"><button class="primary" id="saveObject">${saved?'Saved ✓':'＋ Save'}</button><button id="shareObject">Share</button></div><div class="section"><h3>${primaryHeading(o)}</h3><p>${esc(o.why||o.summary||'')}</p></div>${rel.length?`<div class="section"><h3>Connected from here</h3><div class="connectionRow">${rel.map(connectionHTML).join('')}</div></div>`:''}<div class="tags">${(o.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="section deeper"><h3>Deeper</h3><p>${o.subtype==='stay'?'From the original LBNB Lebanon collection. Current host details, availability and booking information are being reconfirmed; no old account passwords are reused.':'This prototype keeps the first layer light. Practical information and sources live here when they become useful.'}</p>${practicalHTML(o)}</div></div>`;
$('closeSheet').onclick=closeSheet;if($('sheetBack'))$('sheetBack').onclick=sheetBack;$('saveObject').onclick=()=>{const on=toggleSaved(o.id);$('saveObject').textContent=on?'Saved ✓':'＋ Save';showToast(on?`Saved to ${destination(o)}`:'Removed')};$('shareObject').onclick=()=>shareObject(o);document.querySelectorAll('[data-connect]').forEach(el=>el.onclick=()=>openObject(obj(el.dataset.connect),true));bindSheetGesture()}
function openObject(o,push=true){if(!o)return;if(push){if(!objectStack.length||objectStack.at(-1)!==o.id)objectStack.push(o.id)}$('backdrop').hidden=false;$('sheet').hidden=false;renderSheet(o)}
function sheetBack(){if(objectStack.length>1){objectStack.pop();renderSheet(obj(objectStack.at(-1)))}}
function closeSheet(){objectStack=[];$('sheet').hidden=true;$('backdrop').hidden=true;$('sheet').classList.remove('expanded')}
function bindSheetGesture(){const z=$('grabZone'),sheet=$('sheet');let sy=0;z.addEventListener('pointerdown',e=>{sy=e.clientY;z.setPointerCapture(e.pointerId)});z.addEventListener('pointerup',e=>{const dy=e.clientY-sy;if(dy<-35)sheet.classList.add('expanded');else if(dy>35&&sheet.classList.contains('expanded'))sheet.classList.remove('expanded');else sheet.classList.toggle('expanded')})}
async function shareObject(o){const u=new URL(location.href);u.searchParams.set('o',o.id);try{if(navigator.share)await navigator.share({title:o.title,text:o.summary,url:u.toString()});else if(navigator.clipboard){await navigator.clipboard.writeText(u.toString());showToast('Link copied')}}catch(e){}}
function openDeepLink(){const id=new URLSearchParams(location.search).get('o');if(obj(id))setTimeout(()=>openObject(obj(id),true),250)}


let exploreFilter='All';
function legacyStays(){return data.objects.filter(o=>o.subtype==='stay')}
function exploreRegions(){const counts={};legacyStays().forEach(o=>counts[o.region||'Lebanon']=(counts[o.region||'Lebanon']||0)+1);return ['All',...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];}
function openExplore(){closeSheet();$('myView').hidden=true;$('journeyView').hidden=true;$('exploreView').hidden=false;exploreFilter='All';renderExplore();setTimeout(()=>$('exploreSearch')?.focus({preventScroll:true}),100)}
function closeExplore(){$('exploreView').hidden=true}
function renderExplore(){const q=($('exploreSearch')?.value||'').trim().toLowerCase(),regions=exploreRegions();$('filterChips').innerHTML=regions.map(r=>`<button class="${r===exploreFilter?'active':''}" data-filter="${esc(r)}">${esc(r)}</button>`).join('');let list=legacyStays().filter(o=>(exploreFilter==='All'||o.region===exploreFilter)&&(!q||[o.title,o.area,o.region,...(o.tags||[])].join(' ').toLowerCase().includes(q)));list.sort((a,b)=>(b.media?.length||0)-(a.media?.length||0)||a.title.localeCompare(b.title));$('exploreMeta').textContent=`${list.length} Lebanon places · original LBNB collection`;$('exploreGrid').innerHTML=list.map(o=>`<button class="stayCard" data-object="${esc(o.id)}"><div class="stayVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="stayCopy"><small>${esc(o.region||'Lebanon')}</small><strong>${esc(o.title)}</strong><span>${esc(o.area||'Lebanon')}</span></div></button>`).join('');bindCards($('exploreGrid'));$('filterChips').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{exploreFilter=b.dataset.filter;renderExplore()})}

function savedGroups(){const g={};readSaved().map(obj).filter(Boolean).forEach(o=>(g[destination(o)]||(g[destination(o)]=[])).push(o));return g}
function openMy(tab='saved'){closeSheet();currentMyTab=tab;$('myView').hidden=false;renderMy()}

const JOURNEY_ORDER_KEY='nava_v11_journey_order';
const JOURNEY_REPLACE_KEY='nava_v11_journey_replacements';
function readOrder(){try{return JSON.parse(localStorage.getItem(JOURNEY_ORDER_KEY)||'{}')}catch(e){return{}}}
function writeOrder(v){localStorage.setItem(JOURNEY_ORDER_KEY,JSON.stringify(v))}
function readReplacements(){try{return JSON.parse(localStorage.getItem(JOURNEY_REPLACE_KEY)||'{}')}catch(e){return{}}}
function writeReplacements(v){localStorage.setItem(JOURNEY_REPLACE_KEY,JSON.stringify(v))}
function journeyOrderKey(){return journeyMode==='slow'?'slow':(journeyVariant==='local'?'local':'normal')}
function journeyNodes(){const j=data.journeys[0];let base=(journeyMode==='slow'?(j.slower_nodes||j.nodes):j.nodes).map(n=>({...n,_key:n.object_id}));if(journeyVariant==='local')base=base.filter(n=>['alfama','fado-story','rossio-baixa','calcada-portuguesa'].includes(n.object_id));const rep=readReplacements();base=base.map(n=>rep[n._key]?{...n,object_id:rep[n._key],note:'Your chosen replacement.'}:n);const orders=readOrder(),order=orders[journeyOrderKey()]||[];if(order.length){const idx=Object.fromEntries(order.map((k,i)=>[k,i]));base.sort((a,b)=>(idx[a._key]??999)-(idx[b._key]??999))}return base}
function shiftTime(t,min){if(!t)return'';const [h,m]=t.split(':').map(Number),total=h*60+m+min;return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function displayJourneyNodes(nodes){const slots=nodes.filter(n=>n.role!=='context'&&n.time).map(n=>n.time).sort();let i=0;return nodes.map(n=>({...n,_displayTime:n.role==='context'?'':(slots[i++]||'')}))}
function renderJourney(){const j=data.journeys[0],planned=localStorage.getItem(PLANNED_KEY)==='1',nodes=displayJourneyNodes(journeyNodes());$('journeyContent').innerHTML=`<div class="journeyHero"><small>${esc(j.destination)} · ${esc(j.duration)}</small><h2>${esc(j.title)}</h2><p>${esc(j.description)}</p></div><div class="journeyControls"><button id="looksGood" class="${planned?'active':''}">${planned?'Planned ✓':'Looks good'}</button><button id="slower" class="${journeyMode==='slow'?'active':''}">Make it slower</button><button id="changeSomething">Change something</button></div><div class="journeyDragHint">Drag any card up or down to change the order.</div><div class="timeline" id="journeyTimeline">${nodes.map((n,idx)=>{const o=obj(n.object_id);if(!o)return'';let time=n._displayTime||'';if(journeyVariant==='late')time=shiftTime(time,60);return `<div class="node ${n.role==='context'?'context':''}" data-node-key="${esc(n._key)}" data-journey-index="${idx}"><div class="nodeDot"></div><div class="nodeTime">${esc(time)}</div><button class="nodeCard" type="button"><div class="nodeVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="nodeCopy"><small>${esc(n.role==='context'?'along the way':displayType(o))}</small><strong>${esc(o.title)}</strong><span>${esc(n.note||'')}</span></div></button></div>`}).join('')}<div class="continuation">Continue from this place whenever you want. The Journey folds back into Discovery.</div></div>`;bindJourneyDrag();$('looksGood').onclick=()=>{const p=localStorage.getItem(PLANNED_KEY)!=='1';localStorage.setItem(PLANNED_KEY,p?'1':'0');showToast(p?'Journey planned':'Journey unplanned');renderJourney()};$('slower').onclick=()=>{journeyMode=journeyMode==='slow'?'normal':'slow';showToast(journeyMode==='slow'?'More breathing room':'Original rhythm');renderJourney()};$('changeSomething').onclick=openChangeSheet}
function bindJourneyDrag(){const tl=$('journeyTimeline');if(!tl)return;tl.querySelectorAll('.node').forEach(node=>{const card=node.querySelector('.nodeCard');let sy=0,drag=false,lastY=0;card.addEventListener('pointerdown',e=>{sy=lastY=e.clientY;drag=false;card.setPointerCapture(e.pointerId)});card.addEventListener('pointermove',e=>{if(!card.hasPointerCapture(e.pointerId))return;lastY=e.clientY;if(!drag&&Math.abs(lastY-sy)>9){drag=true;node.classList.add('draggingNode');tl.classList.add('reordering')}if(!drag)return;const others=[...tl.querySelectorAll('.node')].filter(x=>x!==node);for(const target of others){const r=target.getBoundingClientRect(),mid=r.top+r.height/2;if(lastY<mid){tl.insertBefore(node,target);break}if(target===others.at(-1))tl.insertBefore(node,tl.querySelector('.continuation'))}});card.addEventListener('pointerup',e=>{try{card.releasePointerCapture(e.pointerId)}catch{};node.classList.remove('draggingNode');tl.classList.remove('reordering');if(drag){const order=[...tl.querySelectorAll('.node')].map(x=>x.dataset.nodeKey),all=readOrder();all[journeyOrderKey()]=order;writeOrder(all);showToast('Journey reordered');renderJourney()}else{const n=journeyNodes().find(x=>x._key===node.dataset.nodeKey);openObject(obj(n?.object_id),true)}})})}
function openChangeSheet(){$('actionSheet').innerHTML=`<div class="sheetTitle">Change something</div><button data-change="late">Start later<span class="optionMeta">Shift the day without changing the order.</span></button><button data-change="replace">Replace a stop<span class="optionMeta">Choose exactly which stop to change.</span></button><button data-change="local">Stay in one area<span class="optionMeta">Keep the Journey around Alfama and Baixa.</span></button><button class="cancel" data-change="cancel">Cancel</button>`;$('actionSheet').hidden=false;$('actionSheet').querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{const v=b.dataset.change;if(v==='replace'){openReplaceStopSheet();return}$('actionSheet').hidden=true;if(v!=='cancel'){journeyVariant=journeyVariant===v?'default':v;showToast(v==='late'?'Starting later':'Keeping it local');renderJourney()}})}
function openReplaceStopSheet(){const nodes=journeyNodes().filter(n=>n.role!=='context');$('actionSheet').innerHTML=`<div class="sheetTitle">Which stop do you want to replace?</div>${nodes.map(n=>{const o=obj(n.object_id);return `<button data-replace-key="${esc(n._key)}">${esc(o?.title||'Stop')}<span class="optionMeta">${esc(o?.area||o?.destination||'')}</span></button>`}).join('')}<button class="cancel" id="replaceCancel">Cancel</button>`;$('actionSheet').hidden=false;$('actionSheet').querySelectorAll('[data-replace-key]').forEach(b=>b.onclick=()=>openReplacementChoices(b.dataset.replaceKey));$('replaceCancel').onclick=()=>{$('actionSheet').hidden=true}}
function openReplacementChoices(key){const current=journeyNodes(),currentIds=new Set(current.map(n=>n.object_id)),target=current.find(n=>n._key===key),targetObj=obj(target?.object_id);let choices=data.objects.filter(o=>o.destination==='Lisbon'&&o.type==='place'&&o.subtype!=='stay'&&!currentIds.has(o.id));if(targetObj?.area)choices.sort((a,b)=>(a.area===targetObj.area?-1:0)-(b.area===targetObj.area?-1:0));choices=choices.slice(0,8);$('actionSheet').innerHTML=`<div class="sheetTitle">Replace ${esc(targetObj?.title||'this stop')} with…</div>${choices.map(o=>`<button data-replacement="${esc(o.id)}">${esc(o.title)}<span class="optionMeta">${esc(o.area||o.destination||'')}</span></button>`).join('')}<button class="cancel" id="choiceCancel">Back</button>`;$('actionSheet').querySelectorAll('[data-replacement]').forEach(b=>b.onclick=()=>{const rep=readReplacements();rep[key]=b.dataset.replacement;writeReplacements(rep);$('actionSheet').hidden=true;showToast('Stop replaced');renderJourney()});$('choiceCancel').onclick=()=>openReplaceStopSheet()}

function closeJourney(){$('journeyView').hidden=true;openMy('journeys')}

function readPlan(){
  let p;
  try{p=JSON.parse(localStorage.getItem(PLAN_KEY)||'null')}catch(e){p=null}
  p=p||{planned:localStorage.getItem(PLANNED_KEY)==='1',date:''};
  const start=p.start_date||p.date||'';
  const end=p.end_date||start||'';
  return {...p,start_date:start,end_date:end,date:start};
}
function writePlan(p){
  const current=readPlan();
  const n={...current,...p};
  n.start_date=n.start_date||n.date||'';
  n.end_date=n.end_date||n.start_date||'';
  n.date=n.start_date;
  localStorage.setItem(PLAN_KEY,JSON.stringify(n));
  localStorage.setItem(PLANNED_KEY,n.planned?'1':'0');
}

  $('closeSheet').onclick=closeSheet;if($('sheetBack'))$('sheetBack').onclick=sheetBack;$('saveObject').onclick=()=>{const on=toggleSaved(o.id);$('saveObject').textContent=on?'Saved ✓':'＋ Save';showToast(on?`Saved to ${destination(o)}`:'Removed')};$('shareObject').onclick=()=>shareObject(o);document.querySelectorAll('[data-connect]').forEach(el=>el.onclick=()=>openObject(obj(el.dataset.connect),true));
  if($('checkAvailability'))$('checkAvailability').onclick=()=>openStayBookingSheet(o,'select');if($('addBooking'))$('addBooking').onclick=()=>o.subtype==='stay'?openStayBookingSheet(o,'existing'):openBookingSheet(o);if($('editBooking'))$('editBooking').onclick=()=>o.subtype==='stay'?openStayBookingSheet(o,bookingForObject(o.id)?.status==='selected'?'select':'existing'):openBookingSheet(o);
  const hero=$('sheetScroller').querySelector('.sheetHero');if(hero)hero.addEventListener('click',e=>{if(e.target.closest('.sheetTop'))return;openMediaViewer((o.media&&o.media.length)?o.media:o.image,o.title,o.summary||'',displayType(o),false)});
  bindSheetGesture();bindImageFallbacks($('sheetScroller'))
}

function openStayBookingSheet(o,mode='select'){
  const current=bookingForObject(o.id),plan=readPlan(),checkin=current?.date||plan.start_date||todayISO(),plannedOut=(plan.end_date&&plan.end_date>checkin)?plan.end_date:'',checkout=current?.end_date||plannedOut||addDaysISO(checkin,1),existing=mode==='existing'||current?.status==='booked';
  $('actionSheet').innerHTML=`<div class="sheetTitle">${current?'Edit stay':'Stay dates'}</div><div class="sheetHelp">${existing?'Record a lodging booking you already have.':'Select the lodging and dates in NAVA. Live host availability/payment is not connected in this pilot yet.'}</div><div class="formRow"><label>Check-in</label><input id="stayCheckin" type="date" value="${esc(checkin)}"><label>Check-out</label><input id="stayCheckout" type="date" value="${esc(checkout)}"><label>Guests</label><input id="stayGuests" type="number" min="1" max="20" value="${esc(current?.guests||'2')}">${existing?`<label>Confirmation / note</label><input id="stayConfirmation" type="text" value="${esc(current?.confirmation||'')}" placeholder="Optional reference or note">`:''}</div><button class="primarySheet" id="saveStayBooking">${existing?'Save booking':'Select this stay'}</button>${current?'<button class="dangerSheet" id="removeBooking">Remove stay</button>':''}<button class="cancel" id="stayBookingCancel">Cancel</button>`;
  $('actionSheet').hidden=false;const ci=$('stayCheckin'),co=$('stayCheckout');ci.onchange=()=>{co.min=ci.value;if(!co.value||co.value<=ci.value)co.value=addDaysISO(ci.value,1)};co.min=ci.value;
  $('saveStayBooking').onclick=()=>{if(!ci.value)return showToast('Choose check-in');if(!co.value||co.value<=ci.value)return showToast('Check-out must follow check-in');const v=readBookings().filter(b=>b.object_id!==o.id);v.push({id:current?.id||('b-'+Date.now()),object_id:o.id,date:ci.value,end_date:co.value,guests:$('stayGuests').value,confirmation:$('stayConfirmation')?.value.trim()||'',status:existing?'booked':'selected',kind:'stay'});writeBookings(v);if(!isSaved(o.id))toggleSaved(o.id);$('actionSheet').hidden=true;showToast(existing?'Booking saved':'Stay selected');renderSheet(o);if(!$('journeyView').hidden)renderJourney()};
  if($('removeBooking'))$('removeBooking').onclick=()=>{writeBookings(readBookings().filter(b=>b.object_id!==o.id));$('actionSheet').hidden=true;showToast('Stay removed');renderSheet(o)};$('stayBookingCancel').onclick=()=>{$('actionSheet').hidden=true}
}
function openBookingSheet(o){const current=bookingForObject(o.id),plan=readPlan();$('actionSheet').innerHTML=`<div class="sheetTitle">${current?'Edit booking':'Add booking details'}</div><div class="formRow"><label>Date</label><input id="bookingDate" type="date" value="${esc(current?.date||plan.start_date||todayISO())}"><label>Time</label><input id="bookingTime" type="time" value="${esc(current?.time||'')}"><label>Confirmation / note</label><input id="bookingConfirmation" type="text" value="${esc(current?.confirmation||'')}" placeholder="Optional reference or note"></div><button class="primarySheet" id="saveBooking">Save booking</button>${current?'<button class="dangerSheet" id="removeBooking">Remove booking</button>':''}<button class="cancel" id="bookingCancel">Cancel</button>`;$('actionSheet').hidden=false;$('saveBooking').onclick=()=>{const date=$('bookingDate').value;if(!date)return showToast('Choose a date');const v=readBookings().filter(b=>b.object_id!==o.id);v.push({id:current?.id||('b-'+Date.now()),object_id:o.id,date,end_date:date,time:$('bookingTime').value,confirmation:$('bookingConfirmation').value.trim(),status:'booked'});writeBookings(v);if(!isSaved(o.id))toggleSaved(o.id);$('actionSheet').hidden=true;showToast('Booking saved');renderSheet(o);if(!$('journeyView').hidden)renderJourney()};if($('removeBooking'))$('removeBooking').onclick=()=>{writeBookings(readBookings().filter(b=>b.object_id!==o.id));$('actionSheet').hidden=true;showToast('Booking removed');renderSheet(o)};$('bookingCancel').onclick=()=>{$('actionSheet').hidden=true}}

function renderMy(){document.querySelectorAll('[data-my-tab]').forEach(b=>b.classList.toggle('active',b.dataset.myTab===currentMyTab));const c=$('myContent');if(currentMyTab==='saved'){const g=savedGroups(),dests=Object.keys(g),count=readSaved().length;if(!count){c.innerHTML='<p class="sub">Everything you save becomes material for a future Journey.</p><div class="empty">Nothing saved yet.<br>Use ＋ while discovering.</div>';return}c.innerHTML=`<p class="sub">A personal collection first. A Journey only when it becomes useful.</p>${dests.map(d=>`<section class="collection"><div class="collectionHead"><h2>${esc(d)}</h2><span>${g[d].length} saved</span></div><div class="savedGrid">${g[d].map(o=>`<button class="savedCard" data-object="${esc(o.id)}">${imageFrame(o.image,'savedVisual',o.subtype==='stay'?'Historical photo':'Photo')}<div class="copy"><small>${esc(displayType(o))}</small><h3>${esc(o.title)}</h3><p>${esc(o.area||o.destination||'')}</p></div><span class="remove" data-remove="${esc(o.id)}">×</span></button>`).join('')}</div>${d==='Lisbon'&&g[d].length>=3?`<div class="journeyCta"><div><strong>See one way these could flow</strong><span>Stone, Sound & River · one day</span></div><button id="openJourneyCta">Open Journey</button></div>`:''}</section>`).join('')}`;bindCards(c);bindImageFallbacks(c);c.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();toggleSaved(el.dataset.remove);renderMy()});if($('openJourneyCta'))$('openJourneyCta').onclick=()=>openJourney('edit');return}
  if(currentMyTab==='bookings'){const bs=readBookings().sort((a,b)=>(a.date||'').localeCompare(b.date||''));c.innerHTML=`<p class="sub">Bookings and selected stays live here. Dated commitments can anchor a Journey.</p>${bs.length?`<div class="bookingList">${bs.map(b=>{const o=obj(b.object_id);return `<div class="bookingCard"><div class="icon">✓</div><div class="info"><small>${esc(displayType(o))} · ${esc(bookingStatusLabel(b).toLowerCase())}</small><strong>${esc(o?.title||'Booking')}</strong><span>${esc(bookingDateLabel(b))}${b.time?` · ${esc(b.time)}`:''}${b.guests?` · ${esc(b.guests)} guests`:''}</span></div><button data-booking-object="${esc(b.object_id)}">Open</button></div>`}).join('')}</div>`:'<div class="empty">No bookings yet.<br>Choose dates from a Stay or add booking details from an Experience.</div>'}`;c.querySelectorAll('[data-booking-object]').forEach(b=>b.onclick=()=>openObject(obj(b.dataset.bookingObject),true));return}
  const plan=readPlan(),j=data.journeys?.[0];c.innerHTML=`<p class="sub">A planned Journey persists here after you approve it. Switch between the list and calendar whenever dates become useful.</p><div class="journeySubTabs"><button class="${journeyMyMode==='list'?'active':''}" data-jm="list">List</button><button class="${journeyMyMode==='calendar'?'active':''}" data-jm="calendar">Calendar</button></div>${journeyMyMode==='calendar'?calendarHTML(plan):journeyListHTML(j,plan)}`;c.querySelectorAll('[data-jm]').forEach(b=>b.onclick=()=>{journeyMyMode=b.dataset.jm;renderMy()});if($('openJourneyList'))$('openJourneyList').onclick=()=>openJourney(plan.planned?'itinerary':'edit');if($('dateJourneyList'))$('dateJourneyList').onclick=openDatePicker;if($('dateJourneyCalendar'))$('dateJourneyCalendar').onclick=openDatePicker
}
function journeyListHTML(j,plan){return `<div class="journeyCta"><div><strong>${esc(j?.title||'Stone, Sound & River')}</strong><span>${esc(j?.destination||'Lisbon')} · ${plan.planned?esc(planDateLabel(plan)):esc(j?.duration||'one day')}</span></div><button id="openJourneyList">${plan.planned?'Open itinerary':'Open'}</button></div>${plan.planned?`<div class="planMeta"><span class="planBadge dark">Planned</span><button class="planBadge planDateButton" id="dateJourneyList">${esc(planDateLabel(plan))}</button></div>`:`<div class="journeyCta"><div><strong>Ready when you are</strong><span>Approve the Journey, then assign start/end dates or leave it open.</span></div><button id="dateJourneyList">Plan</button></div>`}`}
function calendarHTML(plan){const bookings=readBookings(),base=plan.start_date?new Date(plan.start_date+'T12:00:00'):(bookings[0]?.date?new Date(bookings[0].date+'T12:00:00'):new Date()),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7,monthLabel=new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(first);let cells='';for(let i=0;i<offset;i++)cells+='<div class="calDay empty"></div>';for(let d=1;d<=days;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,isJ=plan.planned&&rangeIncludes(iso,plan.start_date,plan.end_date),bs=bookings.filter(b=>rangeIncludes(iso,b.date,b.end_date));cells+=`<div class="calDay ${isJ?'journeyDay':''} ${bs.length?'bookingDay':''}">${d}${isJ&&iso===plan.start_date?'<span class="calEvent">Stone, Sound & River</span>':''}${bs.filter(b=>b.date===iso).slice(0,1).map(b=>`<span class="calEvent">${esc(obj(b.object_id)?.title||'Booking')}</span>`).join('')}</div>`}return `<div class="calendarCard"><div class="calendarHead"><strong>${esc(monthLabel)}</strong><button class="planBadge planDateButton" id="dateJourneyCalendar">${plan.planned?esc(planDateLabel(plan)):'Choose Journey dates'}</button></div><div class="calendarGrid">${['M','T','W','T','F','S','S'].map(x=>`<div class="calDow">${x}</div>`).join('')}${cells}</div></div>${!plan.planned?'<div class="journeyCta"><div><strong>Add this Journey to the calendar</strong><span>You can also leave it undated.</span></div><button id="dateJourneyList">Choose dates</button></div>':''}`}

function renderJourney(){const j=data.journeys[0],plan=readPlan(),nodes=displayJourneyNodesV12(journeyNodes());$('journeyContent').innerHTML=`<div class="journeyHero"><small>${esc(j.destination)} · ${esc(j.duration)}</small><h2>${esc(j.title)}</h2><p>${esc(j.description)}</p></div>${plan.planned?`<div class="planMeta"><span class="planBadge dark">Planned ✓</span><button class="planBadge planDateButton" id="journeyDatesButton">${esc(planDateLabel(plan))}</button></div>`:''}<div class="journeyModeTabs"><button class="${journeyViewMode==='edit'?'active':''}" data-jview="edit">Edit</button><button class="${journeyViewMode==='itinerary'?'active':''}" data-jview="itinerary">Itinerary</button><button class="${journeyViewMode==='map'?'active':''}" data-jview="map">Map</button></div>${journeyViewMode==='itinerary'?itineraryHTML(j,nodes,plan):journeyViewMode==='map'?mapHTML(j,nodes,plan):journeyEditHTML(j,nodes,plan)}`;document.querySelectorAll('[data-jview]').forEach(b=>b.onclick=()=>{journeyViewMode=b.dataset.jview;renderJourney()});if($('journeyDatesButton'))$('journeyDatesButton').onclick=openDatePicker;if(journeyViewMode==='edit')bindJourneyEditControls();if(journeyViewMode==='itinerary'){$('itineraryStrip')?.querySelectorAll('[data-itin-object]').forEach(b=>b.onclick=()=>openObject(obj(b.dataset.itinObject),true));if($('backToEdit'))$('backToEdit').onclick=()=>{journeyViewMode='edit';renderJourney()};if($('itineraryDateButton'))$('itineraryDateButton').onclick=openDatePicker;bindImageFallbacks($('journeyContent'))}if(journeyViewMode==='map'&&$('editFromMap'))$('editFromMap').onclick=()=>{journeyViewMode='edit';renderJourney()}}
function itineraryHTML(j,nodes,plan){return `<div class="itineraryLead"><div><button class="itineraryDateButton" id="itineraryDateButton">${esc(plan.planned?planDateLabel(plan):'Choose dates')}<span>Horizontal day view · swipe through the flow</span></button></div><span class="planBadge">${nodes.filter(n=>n.role!=='context').length} stops</span></div><div class="itineraryStrip" id="itineraryStrip">${nodes.map((n,i)=>{const o=obj(n.object_id);if(!o)return'';let time=n._displayTime||'';if(journeyVariant==='late'&&!n._booking)time=shiftTime(time,60);return `${i?'<div class="itinConnector">→</div>':''}<button class="itinItem ${n.role==='context'?'context':''}" data-itin-object="${esc(o.id)}">${n.role==='context'?'':imageFrame(o.image,'itinVisual',o.subtype==='stay'?'Historical photo':'Photo')}<div class="itinCopy"><small>${esc(n.role==='context'?'along the way':displayType(o))}</small>${time?`<span class="itinTime">${esc(time)}</span>`:''}<strong>${esc(o.title)}</strong><span>${esc(n.note||'')}</span>${n._booking?'<span class="bookedFlag">Booked · fixed</span>':''}</div></button>`}).join('')}</div><div class="journeyCta"><div><strong>Need to change the order?</strong><span>The vertical editor is for rearranging; this horizontal view is for using the day.</span></div><button id="backToEdit">Edit Journey</button></div>`}

function openDateSheet(){const plan=readPlan();$('actionSheet').innerHTML=`<div class="sheetTitle">When is this Journey?</div><button data-plan-date="today">Today<span class="optionMeta">Start and end today.</span></button><button data-plan-date="choose">Choose start & end dates<span class="optionMeta">Set the full trip window.</span></button><button data-plan-date="later">Decide later<span class="optionMeta">Keep it planned without dates.</span></button><button class="cancel" data-plan-date="cancel">Cancel</button>`;$('actionSheet').hidden=false;$('actionSheet').querySelectorAll('[data-plan-date]').forEach(b=>b.onclick=()=>{const v=b.dataset.planDate;if(v==='cancel'){$('actionSheet').hidden=true;return}if(v==='choose'){openDatePicker();return}const d=todayISO();writePlan({planned:true,start_date:v==='today'?d:'',end_date:v==='today'?d:'',date:v==='today'?d:''});$('actionSheet').hidden=true;journeyViewMode='itinerary';showToast('Journey planned');renderJourney()})}
function openDatePicker(){const plan=readPlan(),start=plan.start_date||todayISO(),end=plan.end_date||start;$('actionSheet').innerHTML=`<div class="sheetTitle">Journey dates</div><div class="formRow"><label>Start date</label><input id="journeyStartDateInput" type="date" value="${esc(start)}"><label>End date</label><input id="journeyEndDateInput" type="date" value="${esc(end)}"></div><button class="primarySheet" id="saveJourneyDate">Save dates</button><button class="cancel" id="dateBack">Back</button>`;$('actionSheet').hidden=false;const a=$('journeyStartDateInput'),z=$('journeyEndDateInput');z.min=a.value;a.onchange=()=>{z.min=a.value;if(!z.value||z.value<a.value)z.value=a.value};$('saveJourneyDate').onclick=()=>{if(!a.value)return showToast('Choose a start date');if(!z.value)z.value=a.value;if(z.value<a.value)return showToast('End date must follow start');writePlan({planned:true,start_date:a.value,end_date:z.value,date:a.value});$('actionSheet').hidden=true;journeyViewMode='itinerary';showToast('Journey dates saved');renderJourney();if(!$('myView').hidden)renderMy()};$('dateBack').onclick=openDateSheet}
function openPlanManageSheet(){const p=readPlan();$('actionSheet').innerHTML=`<div class="sheetTitle">Planned Journey</div><button id="viewItinerarySheet">Open itinerary<span class="optionMeta">Use the horizontal day view.</span></button><button id="changeDateSheet">${p.start_date?'Change dates':'Add dates'}<span class="optionMeta">${esc(planDateLabel(p))}</span></button><button class="dangerSheet" id="unplanJourney">Remove from planned</button><button class="cancel" id="planCancel">Cancel</button>`;$('actionSheet').hidden=false;$('viewItinerarySheet').onclick=()=>{$('actionSheet').hidden=true;journeyViewMode='itinerary';renderJourney()};$('changeDateSheet').onclick=openDatePicker;$('unplanJourney').onclick=()=>{writePlan({planned:false,start_date:'',end_date:'',date:''});$('actionSheet').hidden=true;showToast('Journey moved back to draft');renderJourney()};$('planCancel').onclick=()=>{$('actionSheet').hidden=true}}

$('backdrop').onclick=closeSheet;$('exploreBtn').onclick=openExplore;$('exploreBack').onclick=closeExplore;$('exploreSearch').addEventListener('input',renderExplore);$('myBtn').onclick=()=>openMy('saved');$('myBack').onclick=closeMy;$('journeyBack').onclick=closeJourney;$('brandBtn').onclick=()=>{closeSheet();$('exploreView').hidden=true;$('myView').hidden=true;$('journeyView').hidden=true;$('feed').scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('[data-my-tab]').forEach(b=>b.onclick=()=>{currentMyTab=b.dataset.myTab;renderMy()});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadContent();
</script>
