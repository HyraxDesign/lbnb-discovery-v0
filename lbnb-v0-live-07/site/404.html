<style>

.reelFallback{position:absolute;inset:0;display:grid;place-items:center;font-size:11vw;font-weight:800;letter-spacing:-.06em;opacity:.13}@media(min-width:700px){.reelFallback{font-size:62px}}
.topbar{position:absolute;z-index:25;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand,.topActions button{pointer-events:auto;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.42);color:#fff;border-radius:999px;min-height:42px;padding:0 14px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(9px);font-weight:760}.brand{letter-spacing:.08em}.brand small{opacity:.5;font-size:9px;letter-spacing:.04em}.topActions{display:flex;gap:7px}.topActions button{padding:0 13px;font-size:12px}.count{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#fff;color:#111;display:inline-grid;place-items:center;font-size:9px}
.reelCopy{position:absolute;left:18px;right:18px;bottom:194px;z-index:5;text-shadow:0 1px 14px rgba(0,0,0,.35)}.reelMeta{font-size:9px;letter-spacing:.11em;text-transform:uppercase;opacity:.73;margin-bottom:7px}.caption{margin:0;max-width:94%;font-size:22px;line-height:1.08;font-weight:760}
.railShell{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));z-index:8}.rail{display:flex;align-items:flex-end;gap:9px;overflow-x:auto;padding:0 16px 3px;scrollbar-width:none;scroll-behavior:smooth;cursor:grab;user-select:none}.rail.dragging{cursor:grabbing;scroll-behavior:auto}.rail::-webkit-scrollbar{display:none}.railHint{flex:0 0 62px;padding:0 2px 12px;color:rgba(255,255,255,.68);font-size:7px;font-weight:700;letter-spacing:.08em;line-height:1.18;text-transform:uppercase}.railHint b{display:block;color:#fff;font-size:9px;margin-top:2px}.railShift{flex:0 0 1px;height:122px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.22),transparent);margin:6px 1px}.card{flex:0 0 144px;height:151px;border:0;border-radius:16px;overflow:hidden;background:#f7f5f0;color:#171717;text-align:left;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.16);cursor:pointer}.cardVisual{height:78px;background:linear-gradient(145deg,#b8b0a3,#666);overflow:hidden}.cardVisual img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}.cardCopy{padding:8px 10px}.cardCopy small{display:block;text-transform:uppercase;letter-spacing:.09em;color:#777;font-size:7.5px;margin-bottom:4px}.cardCopy strong{display:block;font-size:12px;line-height:1.15}.cardCopy span{display:block;color:#777;font-size:9px;margin-top:4px}.card.saved{outline:2px solid rgba(255,255,255,.7);outline-offset:-2px}

.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;height:68%;max-height:68%;overflow:hidden;background:var(--paper);color:var(--ink);border-radius:25px 25px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.34);transition:height .28s,max-height .28s}.sheet.expanded{height:96%;max-height:96%}.sheetScroller{height:100%;overflow-y:auto;overscroll-behavior:contain}.grabZone{position:sticky;top:0;height:28px;z-index:6;background:linear-gradient(var(--paper) 70%,transparent);display:grid;place-items:start center;padding-top:8px;touch-action:none;cursor:ns-resize}.grab{width:42px;height:4px;border-radius:999px;background:#c9c3b9}.sheetHero{height:148px;position:relative;background:linear-gradient(145deg,#aaa397,#555);overflow:hidden}.expanded .sheetHero{height:235px}.sheetHero img{width:100%;height:100%;object-fit:cover;display:block}.sheetTop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.circle{width:38px;height:38px;border:0;border-radius:50%;background:rgba(0,0,0,.52);color:#fff;font-size:18px;display:grid;place-items:center;backdrop-filter:blur(6px)}.sheetBody{padding:18px 20px 30px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:#777;font-size:8px;margin:0 0 5px}.sheet h2{font-size:29px;line-height:1.04;margin:0 0 8px;letter-spacing:-.025em}.summary{line-height:1.45;color:#595651;margin:0;font-size:14px}.actions{display:flex;gap:9px;margin-top:17px}.actions button{flex:1;min-height:43px;border-radius:999px;border:1px solid #d7d2c8;background:#fff;color:#171717;font-weight:720}.actions .primary{background:#111;color:#fff;border-color:#111}.section{margin-top:21px;padding-top:18px;border-top:1px solid #e0dbd2}.section h3{font-size:13px;margin:0 0 7px}.section p{line-height:1.48;color:#5c5852;margin:0;font-size:13px}.connectionRow{display:flex;gap:9px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none}.connectionRow::-webkit-scrollbar{display:none}.connection{flex:0 0 152px;border:1px solid #ddd8ce;border-radius:15px;background:#fff;color:#171717;text-align:left;padding:0;overflow:hidden}.connection img{width:100%;height:76px;object-fit:cover;display:block;background:#aaa}.connection div{padding:9px}.connection small{font-size:7px;color:#777;letter-spacing:.08em;text-transform:uppercase}.connection strong{display:block;font-size:11px;line-height:1.16;margin-top:4px}.relationship{display:block;font-size:8px;color:#8b857c;margin-top:5px}.tags span{display:inline-block;margin:8px 5px 0 0;padding:6px 9px;border-radius:999px;background:#e9e5dc;font-size:9px}.deeper{display:none}.expanded .deeper{display:block}.practicalGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.fact{border:1px solid #ddd8ce;border-radius:12px;padding:10px;background:#fff}.fact small{display:block;color:#807a71;text-transform:uppercase;font-size:7px;letter-spacing:.08em}.fact b{display:block;margin-top:4px;font-size:11px}.linkBtn{display:inline-flex;margin-top:10px;border:0;border-radius:999px;background:#111;color:#fff;padding:9px 12px;text-decoration:none;font-size:10px;font-weight:700}
.view{position:absolute;inset:0;z-index:40;overflow-y:auto;background:var(--paper);color:var(--ink);padding:max(18px,env(safe-area-inset-top)) 18px max(34px,env(safe-area-inset-bottom))}.view>*{width:100%;max-width:720px;margin-left:auto;margin-right:auto}.viewHeader{display:flex;gap:12px;align-items:flex-start;margin-bottom:20px}.back{width:42px;height:42px;border-radius:50%;border:1px solid #d8d2c7;background:#fff;color:#111}.viewHeader div{flex:1}.viewHeader small{display:block;color:#777;font-size:8px;letter-spacing:.11em;margin:3px 0 4px;text-transform:uppercase}.viewHeader h1{margin:0;font-size:30px;letter-spacing:-.03em}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e6e1d7;padding:4px;border-radius:999px;margin-bottom:22px}.tabs button{border:0;background:transparent;color:#746e65;border-radius:999px;padding:10px;font-size:11px}.tabs button.active{background:#fff;color:#111;font-weight:750}.sub{margin:-9px 0 22px;color:#6d6962;font-size:12px;line-height:1.4}.collection{margin-bottom:28px}.collectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.collection h2{font-size:18px;margin:0}.collectionHead span{font-size:10px;color:#858078}.savedGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.savedCard{position:relative;border:0;border-radius:15px;background:#fff;overflow:hidden;text-align:left;color:#161616;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.05)}.savedVisual{height:98px;background:#999;overflow:hidden}.savedVisual img{width:100%;height:100%;object-fit:cover;display:block}.savedCard .copy{padding:10px}.savedCard small{text-transform:uppercase;color:#777;font-size:7px;letter-spacing:.08em}.savedCard h3{font-size:13px;margin:4px 0 3px;line-height:1.1}.savedCard p{font-size:9px;color:#777;margin:0}.remove{position:absolute;top:7px;right:7px;width:27px;height:27px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}.journeyCta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 26px;padding:15px;border:1px solid #ddd8ce;border-radius:16px;background:#fff}.journeyCta strong{font-size:13px}.journeyCta span{display:block;color:#6d6962;font-size:10px;margin-top:3px;line-height:1.35}.journeyCta button{border:0;border-radius:999px;padding:10px 13px;background:#111;color:#fff;font-size:10px;font-weight:700}.empty{text-align:center;color:#7e786f;margin:15vh auto 0;max-width:240px;font-size:13px;line-height:1.5}
.journeyHero{margin-bottom:18px}.journeyHero small{text-transform:uppercase;letter-spacing:.1em;color:#777;font-size:8px}.journeyHero h2{font-size:30px;line-height:1.02;margin:5px 0 7px;letter-spacing:-.035em}.journeyHero p{margin:0;color:#69645c;font-size:12px;line-height:1.45}.journeyControls{display:flex;gap:7px;overflow-x:auto;margin:16px 0 23px;padding-bottom:2px;scrollbar-width:none}.journeyControls button{flex:0 0 auto;border:1px solid #d8d2c8;background:#fff;color:#111;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:700}.journeyControls button.active{background:#111;color:#fff;border-color:#111}.timeline{position:relative;padding-bottom:16px}.timeline:before{content:"";position:absolute;left:29px;top:18px;bottom:22px;width:1px;background:#cbc4b8}.node{display:grid;grid-template-columns:59px 1fr;gap:10px;position:relative;margin-bottom:12px}.nodeDot{position:absolute;left:24px;top:20px;width:11px;height:11px;border-radius:50%;background:#111;border:3px solid var(--paper)}.node.context .nodeDot{width:8px;height:8px;left:25.5px;background:#9b9489}.nodeTime{padding-top:17px;font-size:9px;color:#7d776e;font-weight:700}.nodeCard{display:grid;grid-template-columns:82px 1fr;border:0;border-radius:15px;background:#fff;overflow:hidden;text-align:left;color:#161616;padding:0;box-shadow:0 5px 18px rgba(0,0,0,.05)}.node.context .nodeCard{grid-template-columns:1fr;border-left:2px solid #cfc8bc;box-shadow:none;background:#eeebe4}.node.context .nodeVisual{display:none}.nodeVisual{height:98px;background:#999}.nodeVisual img{width:100%;height:100%;object-fit:cover;display:block}.nodeCopy{padding:11px}.nodeCopy small{font-size:7px;letter-spacing:.09em;text-transform:uppercase;color:#7b756d}.nodeCopy strong{display:block;font-size:13px;margin-top:4px}.nodeCopy span{display:block;font-size:9px;line-height:1.3;color:#7b756d;margin-top:5px}.continuation{margin:6px 0 0 59px;border:1px dashed #cfc8bc;border-radius:14px;padding:13px;color:#625d56;font-size:11px;background:rgba(255,255,255,.4)}
.actionSheet{position:absolute;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:90;background:#fff;color:#111;border-radius:21px;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.35)}.actionSheet button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:14px 13px;border-radius:14px;font-weight:650}.actionSheet button:hover{background:#f0ede7}.actionSheet .cancel{color:#777;text-align:center}
.toast{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:100;transform:translate(-50%,12px);background:#111;color:#fff;border-radius:999px;padding:11px 15px;font-size:11px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.loader{position:absolute;inset:0;z-index:120;background:#111;display:grid;place-items:center;text-align:center;padding:24px}.loader small{display:block;opacity:.55;margin-top:7px;font-size:10px;letter-spacing:.08em}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="loader" id="loader"><div><b style="letter-spacing:.12em">NAVA</b><small>V1 PROTOTYPE · LOADING</small></div></div>
  <div class="topbar">
    <button class="brand" id="brandBtn">NAVA <small>V1</small></button>
    <div class="topActions"><button id="myBtn">My <span class="count" id="savedCount">0</span></button></div>
  </div>
  <main id="feed"></main>
  <div class="backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden><div class="sheetScroller" id="sheetScroller"></div></section>
  <section class="view" id="myView" hidden>
    <header class="viewHeader"><button class="back" id="myBack">←</button><div><small>Your continuum</small><h1>My</h1></div></header>
    <div class="tabs"><button class="active" data-my-tab="saved">Saved</button><button data-my-tab="journeys">Journeys</button></div>
    <div id="myContent"></div>
  </section>
  <section class="view" id="journeyView" hidden>
    <header class="viewHeader"><button class="back" id="journeyBack">←</button><div><small>Journey</small><h1>Lisbon</h1></div></header>
    <div id="journeyContent"></div>
  </section>
  <div class="actionSheet" id="actionSheet" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<script>
const CONTENT_KEY='nava_v1_content';
const SAVED_KEY='nava_v1_saved';
const PLANNED_KEY='nava_v1_planned';
let data=null, objects={}, objectStack=[], journeyMode='normal', journeyVariant='default', currentMyTab='saved';
const $=id=>document.getElementById(id);
const esc=(s='')=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const valid=d=>d&&Array.isArray(d.objects)&&Array.isArray(d.reels);
const destination=o=>o?.destination||o?.area||'Saved';
function showToast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),1350)}
function readSaved(){try{return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]')}catch(e){return[]}}
function writeSaved(v){localStorage.setItem(SAVED_KEY,JSON.stringify(v));$('savedCount').textContent=v.length;updateSavedCardStates()}
function isSaved(id){return readSaved().includes(id)}
function toggleSaved(id){let s=readSaved(), on=s.includes(id);s=on?s.filter(x=>x!==id):[...s,id];writeSaved(s);return !on}
function updateSavedCardStates(){document.querySelectorAll('[data-object]').forEach(el=>el.classList.toggle('saved',isSaved(el.dataset.object)))}
function obj(id){return objects[id]}

async function loadContent(){let loaded=null;try{const r=await fetch('./lbnb-content-v0.json?v=100',{cache:'reload'});if(r.ok)loaded=await r.json()}catch(e){}if(!valid(loaded)){try{loaded=JSON.parse(localStorage.getItem(CONTENT_KEY)||'null')}catch(e){}}if(!valid(loaded)){document.querySelector('#loader div').innerHTML='<b>Could not load content.</b><small>Open the hosted build or check the JSON file.</small>';return}data=loaded;objects=Object.fromEntries(data.objects.map(o=>[o.id,o]));localStorage.setItem(CONTENT_KEY,JSON.stringify(data));writeSaved(readSaved());renderFeed();$('loader').hidden=true;openDeepLink()}

function reelItems(r){return (r.objects||[]).map(x=>({...x,o:obj(x.object_id)})).filter(x=>x.o)}
function cardHTML(o,role='related'){return `<button class="card ${isSaved(o.id)?'saved':''}" data-object="${esc(o.id)}"><div class="cardVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="cardCopy"><small>${esc(o.type)}${role==='direct'?' · in reel':''}</small><strong>${esc(o.title)}</strong><span>${esc(o.area||o.destination||'')}</span></div></button>`}
function orderedReels(){const requested=new URLSearchParams(location.search).get('r');let list=[...data.reels];if(requested){const i=list.findIndex(r=>r.id===requested);if(i>0)list.unshift(list.splice(i,1)[0]);return list}const s=readSaved().map(obj).filter(Boolean);const counts={};s.forEach(o=>counts[destination(o)]=(counts[destination(o)]||0)+1);const pref=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];if(pref&&Math.random()<.68)list=[...list.filter(r=>r.destination===pref),...list.filter(r=>r.destination!==pref)];else list=list.sort(()=>Math.random()-.5);return list}
function renderFeed(){const reels=orderedReels();$('feed').innerHTML=reels.map((r,i)=>{const items=reelItems(r),first=items[0]?.o,direct=items.filter(x=>x.role==='direct'),related=items.filter(x=>x.role!=='direct');return `<section class="reel" data-reel="${esc(r.id)}"><div class="reelBg">${(r.media||first?.image)?`<img src="${esc(r.media||first.image)}" alt="" loading="${i===0?'eager':'lazy'}" referrerpolicy="no-referrer">`:''}</div><div class="reelFallback">${esc((r.destination||'DISCOVER').toUpperCase())}</div><div class="reelCopy"><div class="reelMeta">${esc(r.destination||'DISCOVER')} · discovery</div><p class="caption">${esc(r.caption||'')}</p></div><div class="railShell"><button class="railArrow left" aria-label="scroll left">‹</button><div class="rail"><div class="railHint">FOLLOW<b>WHAT CONNECTS</b></div>${direct.map(x=>cardHTML(x.o,'direct')).join('')}${related.length?`<div class="railShift"></div>`:''}${related.map(x=>cardHTML(x.o,'related')).join('')}</div><button class="railArrow right" aria-label="scroll right">›</button></div></section>`}).join('');bindCards(document);bindRails();updateSavedCardStates()}
function bindCards(root){root.querySelectorAll('[data-object]').forEach(el=>{el.onclick=e=>{if(e.target.closest('[data-remove]'))return;openObject(obj(el.dataset.object),true)}})}
function bindRails(){document.querySelectorAll('.reel').forEach(reel=>{const rail=reel.querySelector('.rail'),left=reel.querySelector('.railArrow.left'),right=reel.querySelector('.railArrow.right');left.onclick=()=>rail.scrollBy({left:-230,behavior:'smooth'});right.onclick=()=>rail.scrollBy({left:230,behavior:'smooth'});let down=false,startX=0,startScroll=0,moved=false;rail.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){down=true;moved=false;startX=e.clientX;startScroll=rail.scrollLeft;rail.setPointerCapture(e.pointerId);rail.classList.add('dragging')}});rail.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>5)moved=true;rail.scrollLeft=startScroll-dx});rail.addEventListener('pointerup',e=>{down=false;rail.classList.remove('dragging');if(moved){const blocker=ev=>{ev.preventDefault();ev.stopPropagation();rail.removeEventListener('click',blocker,true)};rail.addEventListener('click',blocker,true)}});rail.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&rail.scrollWidth>rail.clientWidth){e.preventDefault();rail.scrollLeft+=e.deltaY}},{passive:false})})}

function primaryHeading(o){if(o.type==='experience')return'The experience';if(o.type==='story')return'The story';return'Why it matters'}
function relationLabel(r){return ({inside:'inside',contains:'contains',near:'near',context:'context',thematic:'related idea',cultural:'cultural link',historical:'historical link',experience:'experience',journey:'continue the journey',contrast:'see the contrast'})[r]||r||'connected'}
function connected(o){return (o.connections||[]).map(c=>({c,o:obj(c.object_id)})).filter(x=>x.o).slice(0,7)}
function connectionHTML(x){const o=x.o;return `<button class="connection" data-connect="${esc(o.id)}">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}<div><small>${esc(o.type)}</small><strong>${esc(o.title)}</strong><span class="relationship">${esc(relationLabel(x.c.relationship))}</span></div></button>`}
function practicalHTML(o){const p=o.practical||{},facts=Object.entries(p).filter(([k])=>k!=='map_query');return `${facts.length?`<div class="practicalGrid">${facts.map(([k,v])=>`<div class="fact"><small>${esc(k.replaceAll('_',' '))}</small><b>${esc(v)}</b></div>`).join('')}</div>`:''}${p.map_query?`<a class="linkBtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.map_query)}">View on map</a>`:''}`}
function renderSheet(o){const rel=connected(o), saved=isSaved(o.id);$('sheetScroller').innerHTML=`<div class="grabZone" id="grabZone"><div class="grab"></div></div><div class="sheetHero">${o.image?`<img src="${esc(o.image)}" alt="" referrerpolicy="no-referrer">`:''}<div class="sheetTop"><button class="circle" id="sheetBack" ${objectStack.length<2?'hidden':''}>←</button><button class="circle" id="closeSheet">×</button></div></div><div class="sheetBody"><p class="eyebrow">${esc(o.type)} · ${esc(o.area||o.destination||'')}</p><h2>${esc(o.title)}</h2><p class="summary">${esc(o.summary||'')}</p><div class="actions"><button class="primary" id="saveObject">${saved?'Saved ✓':'＋ Save'}</button><button id="shareObject">Share</button></div><div class="section"><h3>${primaryHeading(o)}</h3><p>${esc(o.why||o.summary||'')}</p></div>${rel.length?`<div class="section"><h3>Connected from here</h3><div class="connectionRow">${rel.map(connectionHTML).join('')}</div></div>`:''}<div class="tags">${(o.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="section deeper"><h3>Deeper</h3><p>This prototype keeps the first layer light. Practical information and sources live here when they become useful.</p>${practicalHTML(o)}</div></div>`;
$('closeSheet').onclick=closeSheet;if($('sheetBack'))$('sheetBack').onclick=sheetBack;$('saveObject').onclick=()=>{const on=toggleSaved(o.id);$('saveObject').textContent=on?'Saved ✓':'＋ Save';showToast(on?`Saved to ${destination(o)}`:'Removed')};$('shareObject').onclick=()=>shareObject(o);document.querySelectorAll('[data-connect]').forEach(el=>el.onclick=()=>openObject(obj(el.dataset.connect),true));bindSheetGesture()}
function openObject(o,push=true){if(!o)return;if(push){if(!objectStack.length||objectStack.at(-1)!==o.id)objectStack.push(o.id)}$('backdrop').hidden=false;$('sheet').hidden=false;renderSheet(o)}
function sheetBack(){if(objectStack.length>1){objectStack.pop();renderSheet(obj(objectStack.at(-1)))}}
function closeSheet(){objectStack=[];$('sheet').hidden=true;$('backdrop').hidden=true;$('sheet').classList.remove('expanded')}
function bindSheetGesture(){const z=$('grabZone'),sheet=$('sheet');let sy=0;z.addEventListener('pointerdown',e=>{sy=e.clientY;z.setPointerCapture(e.pointerId)});z.addEventListener('pointerup',e=>{const dy=e.clientY-sy;if(dy<-35)sheet.classList.add('expanded');else if(dy>35&&sheet.classList.contains('expanded'))sheet.classList.remove('expanded');else sheet.classList.toggle('expanded')})}
async function shareObject(o){const u=new URL(location.href);u.searchParams.set('o',o.id);try{if(navigator.share)await navigator.share({title:o.title,text:o.summary,url:u.toString()});else if(navigator.clipboard){await navigator.clipboard.writeText(u.toString());showToast('Link copied')}}catch(e){}}
function openDeepLink(){const id=new URLSearchParams(location.search).get('o');if(obj(id))setTimeout(()=>openObject(obj(id),true),250)}

function savedGroups(){const g={};readSaved().map(obj).filter(Boolean).forEach(o=>(g[destination(o)]||(g[destination(o)]=[])).push(o));return g}
function openMy(tab='saved'){closeSheet();currentMyTab=tab;$('myView').hidden=false;renderMy()}
function renderMy(){document.querySelectorAll('[data-my-tab]').forEach(b=>b.classList.toggle('active',b.dataset.myTab===currentMyTab));const c=$('myContent');if(currentMyTab==='saved'){const g=savedGroups(),dests=Object.keys(g),count=readSaved().length;if(!count){c.innerHTML='<p class="sub">Everything you save becomes material for a future Journey.</p><div class="empty">Nothing saved yet.<br>Use ＋ while discovering.</div>';return}c.innerHTML=`<p class="sub">A personal collection first. A Journey only when it becomes useful.</p>${dests.map(d=>`<section class="collection"><div class="collectionHead"><h2>${esc(d)}</h2><span>${g[d].length} saved</span></div><div class="savedGrid">${g[d].map(o=>`<button class="savedCard" data-object="${esc(o.id)}"><div class="savedVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="copy"><small>${esc(o.type)}</small><h3>${esc(o.title)}</h3><p>${esc(o.area||o.destination||'')}</p></div><span class="remove" data-remove="${esc(o.id)}">×</span></button>`).join('')}</div>${d==='Lisbon'&&g[d].length>=3?`<div class="journeyCta"><div><strong>See one way these could flow</strong><span>Stone, Sound & River · one day</span></div><button id="openJourneyCta">Open Journey</button></div>`:''}</section>`).join('')}`;bindCards(c);c.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{e.preventDefault();e.stopPropagation();toggleSaved(el.dataset.remove);renderMy()});if($('openJourneyCta'))$('openJourneyCta').onclick=()=>openJourney()}else{const j=data.journeys?.[0];c.innerHTML=`<p class="sub">Journeys turn saved interests into a possible flow. They are proposals, not checklists.</p><div class="journeyCta"><div><strong>${esc(j?.title||'Stone, Sound & River')}</strong><span>${esc(j?.destination||'Lisbon')} · ${esc(j?.duration||'one day')}</span></div><button id="openJourneyList">Open</button></div>`;$('openJourneyList').onclick=()=>openJourney()}}
function closeMy(){$('myView').hidden=true}

function openJourney(){closeSheet();$('myView').hidden=true;$('journeyView').hidden=false;renderJourney()}
function journeyNodes(){const j=data.journeys[0];let nodes=journeyMode==='slow'?(j.slower_nodes||j.nodes):j.nodes;if(journeyVariant==='local')nodes=nodes.filter(n=>['alfama','fado-story','rossio-baixa','calcada-portuguesa'].includes(n.object_id));if(journeyVariant==='replace')nodes=nodes.map(n=>n.object_id==='maat'?{...n,object_id:'oriente',note:'A contemporary counterpoint instead.'}:n);return nodes}
function shiftTime(t,min){if(!t)return'';const [h,m]=t.split(':').map(Number),total=h*60+m+min;return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function renderJourney(){const j=data.journeys[0],planned=localStorage.getItem(PLANNED_KEY)==='1',nodes=journeyNodes();$('journeyContent').innerHTML=`<div class="journeyHero"><small>${esc(j.destination)} · ${esc(j.duration)}</small><h2>${esc(j.title)}</h2><p>${esc(j.description)}</p></div><div class="journeyControls"><button id="looksGood" class="${planned?'active':''}">${planned?'Planned ✓':'Looks good'}</button><button id="slower" class="${journeyMode==='slow'?'active':''}">Make it slower</button><button id="changeSomething">Change something</button></div><div class="timeline">${nodes.map(n=>{const o=obj(n.object_id);if(!o)return'';let time=n.time||'';if(journeyVariant==='late')time=shiftTime(time,60);return `<div class="node ${n.role==='context'?'context':''}"><div class="nodeDot"></div><div class="nodeTime">${esc(time)}</div><button class="nodeCard" data-object="${esc(o.id)}"><div class="nodeVisual">${o.image?`<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="nodeCopy"><small>${esc(n.role==='context'?'along the way':o.type)}</small><strong>${esc(o.title)}</strong><span>${esc(n.note||'')}</span></div></button></div>`}).join('')}<div class="continuation">Continue from this place whenever you want. The Journey folds back into Discovery.</div></div>`;bindCards($('journeyContent'));$('looksGood').onclick=()=>{const p=localStorage.getItem(PLANNED_KEY)!=='1';localStorage.setItem(PLANNED_KEY,p?'1':'0');showToast(p?'Journey planned':'Journey unplanned');renderJourney()};$('slower').onclick=()=>{journeyMode=journeyMode==='slow'?'normal':'slow';showToast(journeyMode==='slow'?'More breathing room':'Original rhythm');renderJourney()};$('changeSomething').onclick=openChangeSheet}
function openChangeSheet(){$('actionSheet').innerHTML=`<button data-change="late">Start later</button><button data-change="replace">Replace a stop</button><button data-change="local">Stay in one area</button><button class="cancel" data-change="cancel">Cancel</button>`;$('actionSheet').hidden=false;$('actionSheet').querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{const v=b.dataset.change;$('actionSheet').hidden=true;if(v!=='cancel'){journeyVariant=journeyVariant===v?'default':v;showToast(v==='late'?'Starting later':v==='replace'?'One stop changed':'Keeping it local');renderJourney()}})}
function closeJourney(){$('journeyView').hidden=true;openMy('journeys')}

$('backdrop').onclick=closeSheet;$('myBtn').onclick=()=>openMy('saved');$('myBack').onclick=closeMy;$('journeyBack').onclick=closeJourney;$('brandBtn').onclick=()=>{closeSheet();$('myView').hidden=true;$('journeyView').hidden=true;$('feed').scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('[data-my-tab]').forEach(b=>b.onclick=()=>{currentMyTab=b.dataset.myTab;renderMy()});
if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadContent();
</script>
</body>
</html>
